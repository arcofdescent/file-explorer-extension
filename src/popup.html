<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Tidy Files</title>
    <style>
      body {
        width: 260px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 13px;
        padding: 14px;
        color: #1c1e21;
      }
      h1 {
        font-size: 14px;
        margin: 0 0 8px;
      }
      p {
        margin: 0 0 10px;
        line-height: 1.4;
      }
      a {
        color: #3b6fe0;
      }
    </style>
  </head>
  <body>
    <h1>Tidy Files</h1>
    <p>Browse to any <code>file:///</code> folder and it renders as a clean list automatically.</p>
    <p>
      If nothing changes, enable
      <a href="chrome://extensions/?id=" id="ext-link">"Allow access to file URLs"</a>
      for this extension.
    </p>
    <script src="popup.js"></script>
  </body>
</html>
